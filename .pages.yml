                    type: string

                  - name: line3
                    label: Third Line
                    type: string

              - name: text
                label: Hero Text
                type: text

              - name: primaryButton
                label: Primary Button
                type: object

                fields:

                  - name: label
                    label: Button Text
                    type: string

                  - name: url
                    label: Destination
                    type: string
                    readonly: true

              - name: secondaryButton
                label: Secondary Button
                type: object

                fields:

                  - name: label
                    label: Button Text
                    type: string

                  - name: url
                    label: Destination
