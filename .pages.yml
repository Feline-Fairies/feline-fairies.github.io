              - name: statement
                label: Closing Statement
                type: string

              - name: statementLabel
                label: Statement Label
                type: string


          - name: beginning
            label: Our Beginning
            type: object

            fields:

              - name: eyebrow
                label: Small Heading
                type: string

              - name: title
                label: Heading
                type: string

              - name: year
                label: Year
                type: string
                description: "Confirm this fact with the rescue before launch."

              - name: text
                label: Text
                type: text


          - name: help
            label: Final Call to Action
            type: object

            fields:

              - name: eyebrow
                label: Small Heading
                type: string

              - name: title
                label: Heading
                type: string

              - name: text
                label: Text
                type: text

              - name: buttons
                label: Buttons
                type: object

                list:
                  min: 3
                  max: 3
                  collapsible:
                    collapsed: true
                    summary: "{label}"

                fields:

                  - name: label
                    label: Button Text
                    type: string

                  - name: url
