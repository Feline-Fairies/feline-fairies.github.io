              - name: title
                label: Heading
                type: string

              - name: text
                label: Intro Text
                type: text

              - name: items
                label: Steps
                type: object

                list:
                  min: 3
                  max: 3
                  collapsible:
                    collapsed: true
                    summary: "{number} - {title}"

                fields:

                  - name: number
                    label: Number
                    type: string
                    readonly: true

                  - name: title
                    label: Step Title
                    type: string

                  - name: text
                    label: Step Text
                    type: text

              - name: button
                label: Button
                type: object

                fields:

                  - name: label
                    label: Button Text
                    type: string

                  - name: url
                    label: Destination
                    type: string
                    readonly: true


          - name: donation
            label: Donation Call to Action
            type: object

            fields:

              - name: eyebrow
                label: Small Heading
                type: string

              - name: title
                label: Heading
                type: string

              - name: text
                label: Text
                type: text

              - name: button
                label: Button
                type: object

                fields:

                  - name: label
