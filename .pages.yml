            type: object

            fields:

              - name: eyebrow
                label: Small Heading
                type: string

              - name: title
                label: Heading
                type: string

              - name: text
                label: Text
                type: text

              - name: primaryButton
                label: Browse Cats Button
                type: object

                fields:

                  - name: label
                    label: Button Text
                    type: string

                  - name: url
                    label: Destination
                    type: string
                    readonly: true

              - name: secondaryButton
                label: Application Button
                type: object

                fields:

                  - name: label
                    label: Button Text
                    type: string

                  - name: url
                    label: Destination
                    type: string
                    readonly: true


      # ----------------------------------
      # GET INVOLVED
      # ----------------------------------

      - name: get_involved
        label: Get Involved
        type: file
        path: src/_data/getInvolved.json
        format: json

        operations:
          create: false
          rename: false
          delete: false

        fields:

          - name: hero
            label: Page Introduction
            type: object

            fields:

              - name: eyebrow
                label: Small Heading
                type: string

              - name: titleBefore
                label: Main Heading
                type: string

              - name: titleAccent
                label: Accent Heading
                type: string

              - name: text
                label: Intro Text
                type: text


          - name: paths
            label: Ways to Make a Difference
            type: object

            fields:

              - name: eyebrow
                label: Small Heading
                type: string

              - name: items
                label: Action Cards
                type: object

                list:
                  min: 4
                  max: 4
                  collapsible:
                    collapsed: true
                    summary: "{title}"

                fields:

                  - name: number
                    label: Number
                    type: string
                    readonly: true

                  - name: label
                    label: Small Label
                    type: string

                  - name: title
                    label: Card Title
                    type: string

                  - name: text
                    label: Description
                    type: text

                  - name: linkLabel
                    label: Link Text
                    type: string

                  - name: url
                    label: Destination
