# ========================================
# Feline Fairies
# Pages CMS Configuration
# ========================================


# ========================================
# SAFETY
# ========================================

settings:
  content:
    merge: true


# ========================================
# MEDIA LIBRARY
# ========================================

media:
  - name: site_images
    label: Site Images
    input: src/media
    output: /media
    extensions:
      - webp
      - png
      - jpg
      - jpeg
    rename: safe


# ========================================
# CONTENT
# ========================================

content:


  # ======================================
  # QUICK UPDATES
  # ======================================

  - name: quick_updates
    label: Quick Updates
    type: group

    items:


      # ----------------------------------
      # QUICK: ANNOUNCEMENT + CONTACT
      # ----------------------------------

      - name: quick_site
        label: Announcement + Contact
        type: file
        path: src/_data/site.json
        format: json

        operations:
          create: false
          rename: false
          delete: false

        fields:

          - name: announcement
            label: Announcement Bar
            type: object

            fields:

              - name: enabled
                label: Show Announcement
                type: boolean

              - name: text
                label: Announcement Text
                type: string

              - name: linkLabel
                label: Link Text
                type: string

              - name: url
                label: Link Destination
                type: string
                readonly: true


          - name: phone
            label: Phone Number
            type: string
            description: "Visible phone number."


          - name: phoneHref
            label: Phone Link
            type: string
            description: "Example: tel:+17193327146"


          - name: email
            label: Email Address
            type: string
            description: "Leave blank until the rescue confirms the correct public email."


          - name: mailingAddress
            label: Mailing Address
            type: text
            description: "Leave blank until a current mailing address is confirmed."


          - name: donationUrl
            label: PayPal Donation URL
            type: string


          - name: shelterBossUrl
            label: ShelterBoss Adoptable Cats URL
            type: string


          - name: social
            label: Social Media
            type: object

            list:
              min: 2
              max: 2
              collapsible:
                collapsed: true
                summary: "{label}"

            fields:

              - name: label
                label: Platform
                type: string
                readonly: true

              - name: url
                label: Profile URL
                type: string


      # ----------------------------------
      # QUICK: UPCOMING EVENTS
      # ----------------------------------

      - name: quick_events
        label: Upcoming Events
        type: file
        path: src/_data/events.json
        format: json

        operations:
          create: false
          rename: false
          delete: false

        fields:

          - name: items
            label: Upcoming Events
            type: object

            list:
              collapsible:
                collapsed: true
                summary: "{title}"

            description: "Add confirmed events here. Remove an event when it is no longer current."

            fields:

              - name: title
                label: Event Name
                type: string
                required: true

              - name: date
                label: Date
                type: string

              - name: time
                label: Time
                type: string

              - name: location
                label: Location
                type: string

              - name: description
                label: Description
                type: text

              - name: url
                label: Event Details URL
                type: string

              - name: linkLabel
                label: Link Text
                type: string

              - name: external
                label: External Link
                type: boolean
                description: "Turn this on if the event link goes to another website."


      # ----------------------------------
      # QUICK: SUCCESSFUL ADOPTIONS
      # ----------------------------------

      - name: quick_successful_adoptions
        label: Successful Adoptions
        type: file
        path: src/_data/adopt.json
        format: json

        operations:
          create: false
          rename: false
          delete: false

        fields:

          - name: successfulAdoptions
            label: Successful Adoptions
            type: object

            fields:

              - name: title
                label: Section Heading
                type: string

              - name: text
                label: Intro Text
                type: text

              - name: items
                label: Adoption Gallery
                type: object
                description: "TO REPLACE A PHOTO: open the adoption below, remove the current photo, then click the empty photo field to choose or upload the replacement."

                list:
                  collapsible:
                    collapsed: true
                    summary: "{alt}"

                fields:

                  - name: image
                    label: Current Adoption Photo
                    type: image
                    required: true
                    description: "TO REPLACE THIS PHOTO: remove the current image first. Then click the empty image field and choose an existing image or upload the new photo. A square image works best."

                    options:
                      media: site_images
                      path: adoptions
                      extensions:
                        - webp
                        - jpg
                        - jpeg
                        - png
                      rename: safe

                  - name: alt
                    label: Photo Description
                    type: string
                    required: true
                    description: "Briefly describe the cat and adoption shown in the photo for accessibility."


      # ----------------------------------
      # QUICK: HOMEPAGE IMPACT
      # ----------------------------------

      - name: quick_impact
        label: Homepage Impact Numbers
        type: file
        path: src/_data/home.json
        format: json

        operations:
          create: false
          rename: false
          delete: false

        fields:

          - name: impact
            label: Homepage Impact
            type: object

            fields:

              - name: titleBefore
                label: Heading
                type: string

              - name: titleAccent
                label: Accent Heading
                type: string

              - name: items
                label: Impact Statistics
                type: object

                list:
                  min: 3
                  max: 3
                  collapsible:
                    collapsed: true
                    summary: "{number} - {label}"

                fields:

                  - name: number
                    label: Number
                    type: string

                  - name: label
                    label: Description
                    type: string


      # ----------------------------------
      # QUICK: FORMS + LINKS
      # ----------------------------------

      - name: quick_forms
        label: Forms + Links
        type: file
        path: src/_data/forms.json
        format: json

        operations:
          create: false
          rename: false
          delete: false

        fields:

          - name: adoption
            label: Adoption Application
            type: object

            fields:

              - name: embedUrl
                label: Jotform Embed URL
                type: string

              - name: directUrl
                label: Direct Jotform URL
                type: string


          - name: foster
            label: Foster Application
            type: object

            fields:

              - name: embedUrl
                label: Jotform Embed URL
                type: string

              - name: directUrl
                label: Direct Jotform URL
                type: string


          - name: volunteer
            label: Volunteer Application
            type: object

            fields:

              - name: embedUrl
                label: Jotform Embed URL
                type: string
                description: "Currently blank until the official Volunteer Jotform is confirmed."

              - name: directUrl
                label: Direct Jotform URL
                type: string


          - name: surrender
            label: Surrender Request
            type: object

            fields:

              - name: embedUrl
                label: Jotform Embed URL
                type: string

              - name: directUrl
                label: Direct Jotform URL
                type: string


          - name: contact
            label: Contact Form
            type: object

            fields:

              - name: embedUrl
                label: Jotform Embed URL
                type: string
                description: "Currently blank until the official Contact Jotform is confirmed."

              - name: directUrl
                label: Direct Jotform URL
                type: string



  # ======================================
  # PAGES
  # ======================================

  - name: pages
    label: Pages
    type: group

    items:


      # ----------------------------------
      # HOME
      # ----------------------------------

      - name: home
        label: Home
        type: file
