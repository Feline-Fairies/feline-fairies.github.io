              - name: titleBefore
                label: Heading
                type: string

              - name: titleAccent
                label: Accent Heading
                type: string

              - name: text
                label: Text
                type: text

              - name: linkLabel
                label: Link Text
                type: string

              - name: linkUrl
                label: Link Destination
                type: string
                readonly: true


          - name: mission
            label: Mission Section
            type: object

            fields:

              - name: eyebrow
                label: Small Heading
                type: string

              - name: title
                label: Heading
                type: string

              - name: paragraphs
                label: Paragraphs
                type: text

                list:
                  min: 2
                  max: 2

              - name: button
                label: Button
                type: object

                fields:

                  - name: label
                    label: Button Text
                    type: string

                  - name: url
                    label: Destination
                    type: string
                    readonly: true

              - name: image
                label: Mission Image Set
                type: object
                description: "Replace all three responsive sizes together."

                fields:

                  - name: src
                    label: Full Size Image
                    type: image

                    options:
                      media: site_images
                      path: home

                  - name: src640
                    label: 640px Image
                    type: image

                    options:
                      media: site_images
                      path: home

                  - name: src960
                    label: 960px Image
                    type: image

                    options:
                      media: site_images
                      path: home

                  - name: alt
                    label: Image Description
                    type: string

                  - name: width
                    label: Source Width
                    type: number

                  - name: height
                    label: Source Height
