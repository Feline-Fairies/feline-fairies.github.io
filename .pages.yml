                  collapsible:
                    collapsed: true
                    summary: "{number} - {label}"

                fields:

                  - name: number
                    label: Number
                    type: string

                  - name: label
                    label: Description
                    type: string


          - name: paths
            label: Ways to Help
            type: object

            fields:

              - name: eyebrow
                label: Small Heading
                type: string

              - name: title
                label: Heading
                type: string

              - name: text
                label: Intro Text
                type: text

              - name: items
